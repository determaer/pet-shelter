<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <link rel="stylesheet" href="src/assets/our-pets.css" />
  </head>
  <body>
    <header class="pets-page__header">
      <strong class="pets-page__header-logo">
        <p class="logo-title pets-page__header-logo-title">Cozy House</p>
        <span class="logo-subtitle pets-page__header-logo-subtitle"
          >Shelter for pets in Boston</span
        >
      </strong>

      <nav class="pets-page__nav">
        <a class="p-l pets-page__nav-link-selected">About the shelter</a>
        <a class="p-l pets-page__nav-link">Our pets</a>
        <a class="p-l pets-page__nav-link">Help the shelter</a>
        <a class="p-l pets-page__nav-link">Contacts</a>
      </nav>
    </header>

    <main></main>
    <footer class="footer">
      <div class="footer-content">
        <h3 class="h3 footer-contacts-title footer-title">
          For questions and suggestions
        </h3>
        <div class="footer-email footer-text">
          <img src="src/assets/icons/icon-email.svg" alt="email" />
          <address class="h4">email@shelter.com</address>
        </div>
        <div class="footer-phone footer-text">
          <img src="src/assets/icons/icon-phone.svg" alt="phone" />
          <address class="h4">+13 674 567 75 54</address>
        </div>
        <h3 class="h3 footer-address-title footer-title">
          We are waiting for your visit
        </h3>
        <div class="footer-boston footer-text">
          <img src="src/assets/icons/icon-marker.svg" alt="address" />
          <address class="h4">
            1 Central Street, Boston (entrance from the store)
          </address>
        </div>
        <div class="footer-london footer-text">
          <img src="src/assets/icons/icon-marker.svg" alt="address" />
          <address class="h4">18 South Park, London</address>
        </div>
      </div>

      <img
        class="footer-image"
        src="src/assets/footer-puppy.png"
        alt="puppy picture"
      />
    </footer>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
